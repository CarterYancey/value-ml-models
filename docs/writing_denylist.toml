# Phrases the writing check refuses (src/harness/writing.py, `vml-writing`).
#
# One [[phrase]] per habit. `pattern` is a regular expression, matched
# without regard to case and bounded at word edges. `since` is the day
# Carter objected, `quote` is the sentence they quoted, `why` says what
# to write instead. Add an entry the day a phrase is objected to. Never
# remove one.
#
# Words the glossary lists under _Avoid_ are here too when they are safe
# to match on their own. Common words with another ordinary meaning
# ("result", "filter", "check") stay out: the glossary covers them.

[[phrase]]
pattern = "in money"
since = "2026-11-24"
quote = "The size band in money."
why = "shorthand for 'measured as final portfolio value'; say 'by final value' or 'in dollars'"

[[phrase]]
pattern = "on money"
since = "2026-11-24"
quote = "Not carried forward on money."
why = "same shorthand; say 'because the final value did not improve'"

[[phrase]]
pattern = "the money (was|is|were|are)"
since = "2026-11-24"
quote = "the money was the same as the candidate's"
why = "'money' standing for final value; name the measure: 'the final value'"

[[phrase]]
pattern = "in kind"
since = "2026-11-24"
quote = "The picture is unchanged in kind."
why = "a metaphor; say which numbers changed and which did not"

[[phrase]]
pattern = "the picture"
since = "2026-11-24"
quote = "The picture is unchanged in kind."
why = "a metaphor for 'the result'; name the result"

[[phrase]]
pattern = "is yours"
since = "2026-11-24"
quote = "What is bought is yours."
why = "an aphorism; say 'Carter decides what to buy'"

[[phrase]]
pattern = "kept short"
since = "2026-11-24"
quote = "Kept short on purpose:"
why = "a label without a subject; say 'This section is short because ...' or delete it"

[[phrase]]
pattern = "'s reading"
since = "2026-11-24"
quote = "(Carter's reading)"
why = "say 'Carter reads this as ...' in a full sentence"

[[phrase]]
pattern = "flatters?"
since = "2026-11-24"
quote = "flatters the model"
why = "the glossary term is 'selection-biased'"

[[phrase]]
pattern = "not the selection"
since = "2026-11-24"
quote = "The gain is the band, not the selection."
why = "say 'the restriction to larger stocks adds the return; the picks lead their peers by the same margin either way'"

[[phrase]]
pattern = "the band"
since = "2026-11-24"
quote = "The gain is the band, not the selection."
why = "'band' alone is shorthand; the glossary term is 'the larger half' or 'size band'"

[[phrase]]
pattern = "closed stays closed"
since = "2026-11-24"
quote = "Closed stays closed."
why = "say 'the arm stays closed because ...'"

[[phrase]]
pattern = "in all \\d+ years"
since = "2026-09-27"
quote = "in all 16 years"
why = "a count written from memory; copy it from the ledger and say which years"

# From GLOSSARY.md _Avoid_ lines, where a bare match is safe.
[[phrase]]
pattern = "hit rate"
since = "2026-11-24"
quote = "GLOSSARY.md"
why = "the glossary term is 'precision'"

[[phrase]]
pattern = "(test|validation) set"
since = "2026-11-24"
quote = "GLOSSARY.md"
why = "the glossary term is 'the walk-forward folds' or 'the holdout'"

[[phrase]]
pattern = "alpha|outperformance"
since = "2026-11-24"
quote = "GLOSSARY.md"
why = "the glossary term is 'lead over peers' or 'excess CAGR'"

[[phrase]]
pattern = "overfit(s|ted|ting)?"
since = "2026-11-24"
quote = "GLOSSARY.md"
why = "a property of a model, not of a number; say 'selection-biased'"

[[phrase]]
pattern = "variant [A-Z]\\b"
since = "2026-11-24"
quote = "GLOSSARY.md"
why = "name the arm or the config"

[[phrase]]
pattern = "\\bRF\\b"
since = "2026-11-24"
quote = "GLOSSARY.md"
why = "write 'forest' or the config name"

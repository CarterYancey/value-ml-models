# Decision 74 of docs/notes/2026-11-26-decisions.md (2026-11-26), item 2:
# the first look at dataset_v1.5.1's new feature columns in cell C
# ('not a loser'), the candidate's forest configuration (decision 24),
# seed 23, trained on every row and read inside the 100k floor on the
# same-size screen (universe_scope = "test": the arrangement of the
# candidate's screens, eval_screen_peers_dv100k_v141).
#
#   fs0  the 112 rank columns v1.4.1 had: the control on this build
#   fs1  every rank column of v1.5.1, 149
#   fs2  fs1 plus the 18 new columns upstream ships unranked, 167
#   fs3  fs0 plus the 25 fundamental-history ranks, 137
#   fs4  fs1 plus the fourteen 8-K counts, 163
#   fs5  fs0 plus the 8-K counts, 126
#
# Judged (decision 74.4): the screen's lead over same-size peers on the
# 3-year CAGR and the share of losers, paired by test year with fs0, in
# 2005-12 and 2013-20. p@20 and PR-AUC rank the arms as predictors.
#
# Predictions (decision 74.5), written before the run:
#   (a) fs1 within 0.02 of fs0 on p@20 and within 0.01 on the screen
#       lead. Rival: the own-history z-scores and normalized yields are
#       new information for the forest; then fs1 and fs3 lead fs0 by
#       0.01 or more in both halves.
#   (b) fs4 and fs5 no better than fs1 and fs0 on the screen, and
#       lower in 2005-08: the counts are near zero before 2005 and buy
#       era, not quality.
#
# Expanded: 1 cell x 6 feature sets x 1 set x 1 seed = 6 runs.
# Run: .venv/bin/vml-sweep experiments/sweeps/forest_v151_features_nonloser_3y.toml
name = "forest_v151_features_nonloser_3y"
note = "dataset_v1.5.1, cell C inside the 100k floor, the candidate's forest at seed 23: no new column set beats the 112 old ranks on both screen outcomes; the history and trend ranks add nothing to the lead and 2 points of losers; fs0 plus the 8-K counts leads by +0.010 a year with more losers (decisions 74, 75)"
dataset_version = "dataset_v1.5.1"
min_dataset_version = "1.5"
scheme = "walkforward"
folds = "all"
seeds = [23]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
universe_scope = "test"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_path_avg_return",
  "fwd_3y_path_avg_return > fwd_3y_spy_path_avg_return",
  "fwd_3y_max_runup",
  "fwd_3y_realized_vol",
  "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3",
]

sets = [
  {criterion = "entropy", max_depth = 4, max_features = 0.205191, max_samples = 0.663781, min_samples_leaf = 72, n_estimators = 490},  # the candidate's forest
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000


[[cells]]
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"

# fs0: the 112 rank columns of dataset_v1.4.1 — the control on this build
[[features]]
groups = ["ranks"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank", "bvps_consistency_8q_rank",
  "bvps_trend_12q_rank", "bvps_consistency_12q_rank", "bvps_trend_20q_rank", "bvps_consistency_20q_rank",
  "shares_trend_4q_rank", "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
  "roa_5y_median_rank", "roa_5y_std_rank", "roa_5y_z_rank", "roe_5y_median_rank", "roe_5y_std_rank", "roe_5y_z_rank",
  "gross_margin_5y_median_rank", "gross_margin_5y_std_rank", "gross_margin_5y_z_rank",
  "operating_margin_5y_median_rank", "operating_margin_5y_std_rank", "operating_margin_5y_z_rank",
  "earnings_yield_5y_avg_rank", "ocf_yield_5y_avg_rank", "fcf_yield_5y_avg_rank", "earnings_yield_5y_peak_rank",
  "earnings_yield_at_5y_median_margin_rank", "earnings_yield_10y_avg_rank", "netinc_vs_5y_peak_rank",
  "bvps_vs_5y_peak_rank", "netinc_sue_8q_rank", "revenue_sue_8q_rank", "revenue_cagr_10y_rank",
  "bvps_cagr_10y_rank", "shares_cagr_10y_rank",
]

# fs1: every rank column of dataset_v1.5.1, 149
[[features]]
groups = ["ranks"]

# fs2: fs1 plus the 18 new columns upstream ships unranked, 167
[[features]]
groups = ["ranks"]
columns = [
  "revenue_vs_5y_peak", "revenue_quarters_since_5y_peak", "netinc_quarters_since_5y_peak",
  "bvps_quarters_since_5y_peak", "ni_positive_years_10y", "ni_history_years_10y",
  "bvps_up_frac_4q", "bvps_up_frac_8q", "bvps_up_frac_12q", "bvps_up_frac_20q",
  "shares_up_frac_4q", "shares_up_frac_8q", "shares_up_frac_12q", "shares_up_frac_20q",
  "ni_positive_frac_4q", "ni_positive_frac_8q", "ni_positive_frac_12q", "ni_positive_frac_20q",
]

# fs3: fs0 plus the fundamental-history ranks alone, 137
[[features]]
groups = ["ranks"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank", "bvps_consistency_8q_rank",
  "bvps_trend_12q_rank", "bvps_consistency_12q_rank", "bvps_trend_20q_rank", "bvps_consistency_20q_rank",
  "shares_trend_4q_rank", "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
]

# fs4: fs1 plus the fourteen 8-K counts, 163 — the era-marker test
[[features]]
groups = ["ranks"]
families = ["features/events"]

# fs5: fs0 plus the 8-K counts alone, 126
[[features]]
groups = ["ranks"]
families = ["features/events"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank", "bvps_consistency_8q_rank",
  "bvps_trend_12q_rank", "bvps_consistency_12q_rank", "bvps_trend_20q_rank", "bvps_consistency_20q_rank",
  "shares_trend_4q_rank", "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
  "roa_5y_median_rank", "roa_5y_std_rank", "roa_5y_z_rank", "roe_5y_median_rank", "roe_5y_std_rank", "roe_5y_z_rank",
  "gross_margin_5y_median_rank", "gross_margin_5y_std_rank", "gross_margin_5y_z_rank",
  "operating_margin_5y_median_rank", "operating_margin_5y_std_rank", "operating_margin_5y_z_rank",
  "earnings_yield_5y_avg_rank", "ocf_yield_5y_avg_rank", "fcf_yield_5y_avg_rank", "earnings_yield_5y_peak_rank",
  "earnings_yield_at_5y_median_margin_rank", "earnings_yield_10y_avg_rank", "netinc_vs_5y_peak_rank",
  "bvps_vs_5y_peak_rank", "netinc_sue_8q_rank", "revenue_sue_8q_rank", "revenue_cagr_10y_rank",
  "bvps_cagr_10y_rank", "shares_cagr_10y_rank",
]

[model]
name = "random_forest"
bootstrap = true
class_weight = 1.0
n_jobs = 8

# Decision 78 of docs/notes/2026-11-26-decisions.md (2026-11-26), item 2:
# Carter's run-up and no-crash labels against fundamentals-only feature
# sets. The candidate's forest (decision 24), seed 23, trained on every
# row and read inside the 100k floor on the same-size screen.
#
# Cells: C 'not a loser' (the control cell); Carter's three
# (run-up 50% without a 30% fall; run-up 75%; earned 20% or fell no
# further than SPY); 'doubled without a crash' (run-up 100%, never 40%
# down); 'a real gain without a crash' (CAGR 15%, never 30% down).
# Feature sets (named by position in the run names):
#   fs0  the 112 rank columns v1.4.1 had: the control set
#   fs1  every raw fundamental column, 193 (no technical/events/classification/meta)
#   fs2  ranks without the 15 technical ranks + 28 unranked history columns, 162
#   fs3  the compact own-history set, 74 raw columns
#   fs4  fs3 plus dist_5y_high, dist_52w_high, price_vs_5y_avg, 77
#
# Judged (decision 78.1 = 74.4): lead over same-size peers on the 3y CAGR
# and the share of losers, paired by test year with cell C on fs0.
#
# Predictions (decision 78.5), written before the run:
#   (a) fs1 in cell C 0.08-0.12 below fs0 on p@20, lead within 0.02,
#       losers 3-6 points higher, utilities/REITs over-represented.
#       Rival: fs1 matches fs0's lead with no more losers.
#   (b) fs3, fs4 no better than fs1 on p@20; fs4 leads fs3 in 2009-12
#       and has more losers over 16 years.
#   (c) run-up 75% is learned as volatility (picks' realized vol above
#       peers', CAGR lead <= 0.01 or negative, losers above peers');
#       'doubled without a crash' picks look like cell C's.
#   (d) the union label: p@20 lift over base <= 0.10, lead within 0.01
#       of cell C's, no fewer losers.
#   (f) no fundamentals-only arm passes 74.4 against the control.
#
# Expanded: 6 cells x 5 feature sets x 1 set x 1 seed = 30 runs.
# Run: .venv/bin/vml-sweep experiments/sweeps/forest_fund_labels_3y.toml
name = "forest_fund_labels_3y"
dataset_version = "dataset_v1.5.1"
min_dataset_version = "1.5"
scheme = "walkforward"
folds = "all"
seeds = [23]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
universe_scope = "test"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_max_drawdown_from_entry >= 0.5",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.26",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_path_avg_return",
  "fwd_3y_path_avg_return > fwd_3y_spy_path_avg_return",
  "fwd_3y_max_runup",
  "fwd_3y_max_runup >= 1.0",
  "fwd_3y_realized_vol",
  "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3",
  "fwd_3y_max_runup >= 0.5 & fwd_3y_max_drawdown_from_entry < 0.3",
  "fwd_3y_max_runup >= 1.0 & fwd_3y_max_drawdown_from_entry < 0.4",
  "fwd_3y_max_runup >= 0.75",
  "fwd_3y_cagr >= 0.2 | fwd_3y_max_drawdown_from_entry <= fwd_3y_spy_max_drawdown_from_entry",
  "fwd_3y_cagr >= 0.15 & fwd_3y_max_drawdown_from_entry < 0.3",
]

sets = [
  {criterion = "entropy", max_depth = 4, max_features = 0.205191, max_samples = 0.663781, min_samples_leaf = 72, n_estimators = 490},  # the candidate's forest
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[[cells]]
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"

[[cells]]
label = "fwd_3y_max_runup >= 0.5 & fwd_3y_max_drawdown_from_entry < 0.3"

[[cells]]
label = "fwd_3y_max_runup >= 1.0 & fwd_3y_max_drawdown_from_entry < 0.4"

[[cells]]
label = "fwd_3y_max_runup >= 0.75"

[[cells]]
label = "fwd_3y_cagr >= 0.2 | fwd_3y_max_drawdown_from_entry <= fwd_3y_spy_max_drawdown_from_entry"

[[cells]]
label = "fwd_3y_cagr >= 0.15 & fwd_3y_max_drawdown_from_entry < 0.3"

# fs0: the 112 rank columns of dataset_v1.4.1 — the control set
[[features]]
groups = ["ranks"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank",
  "bvps_consistency_8q_rank", "bvps_trend_12q_rank", "bvps_consistency_12q_rank",
  "bvps_trend_20q_rank", "bvps_consistency_20q_rank", "shares_trend_4q_rank",
  "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
  "roa_5y_median_rank", "roa_5y_std_rank", "roa_5y_z_rank", "roe_5y_median_rank",
  "roe_5y_std_rank", "roe_5y_z_rank", "gross_margin_5y_median_rank",
  "gross_margin_5y_std_rank", "gross_margin_5y_z_rank", "operating_margin_5y_median_rank",
  "operating_margin_5y_std_rank", "operating_margin_5y_z_rank", "earnings_yield_5y_avg_rank",
  "ocf_yield_5y_avg_rank", "fcf_yield_5y_avg_rank", "earnings_yield_5y_peak_rank",
  "earnings_yield_at_5y_median_margin_rank", "earnings_yield_10y_avg_rank",
  "netinc_vs_5y_peak_rank", "bvps_vs_5y_peak_rank", "netinc_sue_8q_rank",
  "revenue_sue_8q_rank", "revenue_cagr_10y_rank", "bvps_cagr_10y_rank", "shares_cagr_10y_rank",
]

# fs1: every raw fundamental column, 193 — no technical, events, classification or meta family
[[features]]
groups = ["features"]
exclude_families = ["features/technical", "features/events", "features/classification", "features/meta"]

# fs2: the rank group without the 15 technical ranks, plus the 28 unranked history columns, 162
[[features]]
groups = ["ranks"]
exclude_families = ["ranks/technical"]
columns = [
  "revenue_vs_5y_peak", "revenue_quarters_since_5y_peak", "netinc_quarters_since_5y_peak",
  "bvps_quarters_since_5y_peak", "ni_positive_years_10y", "ni_history_years_10y",
  "bvps_up_frac_4q", "bvps_up_frac_8q", "bvps_up_frac_12q", "bvps_up_frac_20q",
  "shares_up_frac_4q", "shares_up_frac_8q", "shares_up_frac_12q", "shares_up_frac_20q",
  "ni_positive_frac_4q", "ni_positive_frac_8q", "ni_positive_frac_12q", "ni_positive_frac_20q",
  "div_years_paid_10y", "div_streak_10y", "div_cuts_10y", "div_history_years_10y",
  "fund_history_quarters", "ocf_positive_frac_20q", "earnings_yield_5y_pctile",
  "ocf_yield_5y_pctile", "fcf_yield_5y_pctile", "book_to_market_5y_pctile",
]

# fs3: the compact own-history set, 74 raw columns: fundhist and relvalue with the dividend record,
# the loss and cash-flow histories and 24 core ratios
[[features]]
families = ["features/fundhist", "features/relvalue"]
columns = [
  "div_years_paid_10y", "div_streak_10y", "div_cuts_10y", "div_history_years_10y",
  "fund_history_quarters", "ni_positive_frac_20q", "ocf_positive_frac_20q", "earnings_yield",
  "fcf_yield", "ocf_yield", "book_to_market", "ebit_to_ev", "dividend_yield",
  "net_payout_yield", "roa", "roe", "gross_margin", "operating_margin", "roc_greenblatt",
  "cfo_to_assets", "altman_z", "debt_to_equity", "liabilities_to_assets", "interest_coverage",
  "current_ratio", "log_assets", "accruals_to_assets", "piotroski_f", "asset_growth_1y",
  "share_count_growth_1y", "revenue_growth_3y",
]

# fs4: fs3 plus the price against its own past (dist_5y_high, dist_52w_high, price_vs_5y_avg), 77
[[features]]
families = ["features/fundhist", "features/relvalue"]
columns = [
  "div_years_paid_10y", "div_streak_10y", "div_cuts_10y", "div_history_years_10y",
  "fund_history_quarters", "ni_positive_frac_20q", "ocf_positive_frac_20q", "earnings_yield",
  "fcf_yield", "ocf_yield", "book_to_market", "ebit_to_ev", "dividend_yield",
  "net_payout_yield", "roa", "roe", "gross_margin", "operating_margin", "roc_greenblatt",
  "cfo_to_assets", "altman_z", "debt_to_equity", "liabilities_to_assets", "interest_coverage",
  "current_ratio", "log_assets", "accruals_to_assets", "piotroski_f", "asset_growth_1y",
  "share_count_growth_1y", "revenue_growth_3y", "dist_5y_high", "dist_52w_high",
  "price_vs_5y_avg",
]

[model]
name = "random_forest"
bootstrap = true
class_weight = 1.0
n_jobs = 8

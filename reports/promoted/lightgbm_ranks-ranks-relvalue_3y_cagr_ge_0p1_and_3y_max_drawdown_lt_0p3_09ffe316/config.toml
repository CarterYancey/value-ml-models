# "Compounded without a crash" — the data/manual.md §3 example as a
# derived label: ≥ 10% CAGR over 3y AND the forward path never fell
# more than 30% peak-to-trough (`fwd_3y_max_drawdown`, the whole-path
# drawdown; `_from_entry` would be the entry-anchored variant). The two
# stored rungs this replaces (`label_3y_cagr_ge_10` and no drawdown
# binary at all) are why derived labels exist: this cell needed a
# dataset rebuild before v1.3 shipped the continuous drawdowns.
#
# Features: cross-sectional ranks plus the v1.4 relative-value family
# ("cheap for *this* stock", ADR 0018) — its rank variants only, via
# the group-qualified family reference; the raw `*_5y_pctile` shares
# are left to the relvalue ablation sweep. min_dataset_version is
# therefore 1.4, the family's floor, not the label's 1.3.
#
# The ledger cell is the normalized expression string — spacing,
# condition order and `0.10` vs `0.1` all land in the same cell.
# Run: vml-run experiments/lgbm_3y_compounder_no_crash.toml
dataset_version = "dataset_v1.4"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = "all"
label = "fwd_3y_cagr >= 0.10 & fwd_3y_max_drawdown < 0.30"
seed = 7
top_k = [20, 50]
precision_targets = [0.75, 0.9]

note = "v1.4 cagr>=10% & max drawdown<30% over 3y: p@20 0.362 vs base rate 0.112 (3.2x), the largest relative lift found; single seed, no v1.4 baseline yet"
[features]
groups = ["ranks"]
families = ["ranks/relvalue"]

[model]
name = "lightgbm"
n_estimators = 300
learning_rate = 0.05
num_leaves = 15
min_child_samples = 60
subsample = 0.8
subsample_freq = 1
colsample_bytree = 0.8
reg_lambda = 1.0
class_weight = 0.5

# Decision 64 (2026-11-25): single-factor bars inside the fresh-fall
# universe W40 for cells C and recovery, the 12 factors of
# baseline_factors_fallen50_3y_f06, all 16 folds. Deterministic.
# Prediction: lowest 36-month volatility and the conservative score lead
# on cell C; on the recovery label no factor's screen precision is more
# than 0.03 above the peers'.
name = "baseline_factors_fresh40_3y"
dataset_version = "dataset_v1.4.1"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = "all"
seeds = [7]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.26",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_excess_cagr >= 0.1",
]

sets = [
  {rank_column = "conservative_score_rank", higher_is_better = true},
  {rank_column = "vol_36m_rank", higher_is_better = false},
  {rank_column = "roc_greenblatt_rank", higher_is_better = true},
  {rank_column = "mom_12_2_rank", higher_is_better = true},
  {rank_column = "earnings_yield_rank", higher_is_better = true},
  {rank_column = "earnings_yield_vs_5y_median_rank", higher_is_better = true},
  {rank_column = "altman_z_dd_rank", higher_is_better = true},
  {rank_column = "ocf_yield_rank", higher_is_better = true},
  {rank_column = "dist_5y_high_rank", higher_is_better = true},
  {rank_column = "dist_5y_high_rank", higher_is_better = false},
  {rank_column = "log_marketcap_rank", higher_is_better = true},
  {rank_column = "ret_6m_rank", higher_is_better = true},
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dist_52w_high"
op = "<="
value = -0.4

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[[cells]]
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"

[[cells]]
label = "fwd_3y_cagr >= 0.26"

[[features]]
groups = ["ranks"]

[model]
name = "rank_factor"

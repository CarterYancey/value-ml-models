# Decision 43 (2026-11-23), Carter's direction 1: downside at other
# thresholds and horizons. The single-factor bars for
# forest_downside_cells_3y: max drawdown from entry >= 30% / >= 50%
# within 1 and 3 years, every row scored, read inside the 100k floor
# (scope "test", the huber regressor's setting).
# Prediction (2026-11-23): vol_12m_rank is the best factor in every
# cell (as in decision 39's liquid-half cells), PR-AUC 0.10-0.20 above
# base in the 1y cells and 0.10-0.15 in the 3y cells.
name = "baseline_factors_downside_cells"
seeds = [7]
sets = [
  {rank_column = "vol_12m_rank", higher_is_better = true},
  {rank_column = "vol_36m_rank", higher_is_better = true},
  {rank_column = "beta_12m_rank", higher_is_better = true},
]
dataset_version = "dataset_v1.4"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = [2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
top_k = [20, 50, 100]
score_thresholds = [0.3, 0.4, 0.5, 0.6, 0.7]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
universe_scope = "test"
pick_outcomes = [
  "fwd_1y_cagr",
  "fwd_1y_excess_cagr",
  "fwd_1y_max_drawdown_from_entry",
  "fwd_1y_cagr < -0.3",
  "fwd_1y_cagr >= 0.3",
  "fwd_1y_max_drawdown_from_entry >= 0.3",
]

[pick_screen]
per = "quarter"
top_k = 10
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[[cells]]
label = "fwd_1y_max_drawdown_from_entry >= 0.3"

[[cells]]
label = "fwd_1y_max_drawdown_from_entry >= 0.5"

[[cells]]
label = "fwd_3y_max_drawdown_from_entry >= 0.3"

[[cells]]
label = "fwd_3y_max_drawdown_from_entry >= 0.5"

[[features]]
groups = ["ranks"]

[model]
name = "rank_factor"

# The candidate's forest with prequential isotonic calibration, to
# read selection by confidence (Carter, 2026-09-30, decision 13.2 and
# TODO "Calibration"): how many names clear a calibrated probability,
# in which years, and what they went on to do.
#
# A copy of forest_nonloser_dd30_3y with `calibration = "isotonic"`,
# more thresholds and the portfolio screen. Calibration is monotone
# within a fold, so p@K, PR-AUC and the screen are the uncalibrated
# run's; what changes is what a score of 0.8 means.
#
# What is known (2026-09-29, uncalibrated): the top scores are
# 0.81-0.85 for 2006-08 entries (precision 0.15-0.60) and 0.65-0.69
# for 2011-13 (precision near 1.0).
#
# Predictions, written before the run (2026-09-30):
#   1. p@20 0.788 and the screen as in the uncalibrated run (the first
#      folds stay raw until 1,000 rows of history exist; fold 2005 has
#      none).
#   2. Brier below the uncalibrated run's in most years after 2009.
#   3. Calibration does not repair the pre-crash years: each fold's map
#      is learned from earlier years' outcomes, and the 2006-08 entries
#      are scored by maps learned on 2005-07 outcomes that were not yet
#      crash outcomes. `score >= 0.8` still selects rows in 2006-08
#      with a precision under 0.5 there.
#   4. After 2009 a calibrated `score >= 0.8` is met in fewer than half
#      of the years; where it is met its precision is 0.8 or more.
#   If 3 fails (precision at a calibrated 0.8 is 0.7 or more in
#   2006-08), selection by confidence is a way through crash windows
#   and goes to a backtest with a score floor.
name = "forest_nonloser_dd30_isotonic_3y"
dataset_version = "dataset_v1.4"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = "all"
horizon_years = 3
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"
feature_groups = ["ranks"]
seed = 23
top_k = [20, 50]
score_thresholds = [0.5, 0.6, 0.7, 0.8, 0.9]
precision_targets = [0.75, 0.9]
calibration = "isotonic"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.25",
  "fwd_3y_excess_cagr >= 0.05",
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"

[model]
name = "random_forest"
bootstrap = true
class_weight = 1.0
n_jobs = 8
criterion = "entropy"
max_depth = 4
max_features = 0.205191
max_samples = 0.663781
min_samples_leaf = 72
n_estimators = 490

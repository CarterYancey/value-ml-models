# The run queue (docs/agents.md). `vml-queue status` shows where it
# stands; `vml-queue run-next` runs the first item that is not done.
# Order is the order of the list. Every config carries its predictions.
#
# forest_feature_sets_dd_entry_3y is not listed: it was started by hand
# on the host before result records existed, so the queue cannot see
# its progress.


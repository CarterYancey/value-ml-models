# Majority-class baseline for the (3y, beat_spy) cell.
# Baselines run before any tree is trained; every reported model result
# is compared against these.
name = "baseline_majority_3y_beat_spy"
dataset_version = "dataset_v1.0"
scheme = "walkforward"
folds = "all"
horizon_years = 3
label = "label_3y_beat_spy"
feature_groups = ["ranks"]
seed = 7
top_k = [20, 50]

[model]
name = "majority_class"

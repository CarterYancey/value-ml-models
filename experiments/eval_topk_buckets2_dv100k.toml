# Decision 40 (2026-11-23): bucket precision inside the forest top 200 a year.
# Replaces eval_topk_buckets_dv100k.toml, which failed on parse (its
# [pick_screen] top_k was overwritten by the list); nothing else differs.
# Prediction: ranks 1-10 beat 11-50 by under 0.05 on precision in at
# least one half (the record: the top of the ranking is no purer than
# its top 20). Rival: precision rises steadily with rank, top 10 >= 0.85.
name = "topk_buckets2_dv100k"
top_k = [5, 10, 20, 50, 100, 200]
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.25",
  "fwd_3y_excess_cagr >= 0.05",
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

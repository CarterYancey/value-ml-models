# Decision 55 (2026-11-24): the same screen as eval_blend_mom_roc_peers_dv100k.toml with the candidate's
# legs refit on dataset_v1.4.1. Read for the same-size lead and losers of the
# forest (alone) and of the mean-rank blend on the new version.
name = "blend_mom_roc_peers_dv100k_v141"
blend = [
  "experiments/models/factor_mom_12_2_3y_v141_121349f6e682",
  "experiments/models/factor_roc_greenblatt_3y_v141_4457ca01bcfb",
]
top_k = [20, 50]
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.25",
  "fwd_3y_excess_cagr >= 0.05",
]

[pick_screen]

# First real model: depth-3 decision tree on the rank features,
# Depth-limited by design — the extracted rules and
# diagram in reports/ are the deliverable, not just the metrics.
name = "tree_depth3_2y_cagr_ge_0"
dataset_version = "dataset_v1.0"
scheme = "walkforward"
folds = "all"
horizon_years = 2
label = "label_2y_cagr_ge_0"
feature_groups = ["ranks", "sector_ranks"]
seed = 7
top_k = [20, 50]

[model]
name = "decision_tree"
max_depth = 3

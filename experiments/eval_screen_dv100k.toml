# Evaluate a bundle trained on every row inside the universe
# dollar_volume_3m >= 100000, with the portfolio screen of decision 16
# (scope "test": the models are as trained, the test rows are fewer).
name = "screen_dv100k"
top_k = [20, 50]
precision_targets = [0.75, 0.9]
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.25",
  "fwd_3y_excess_cagr >= 0.05",
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

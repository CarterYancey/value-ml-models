# Backtest of a candidate carried forward from forest_pick_anatomy_3y.
# The template is decision 6 of docs/notes/2026-09-29-decisions.md,
# fixed before the first backtest and identical for every candidate
# except the bundles: top 10 a month, equal weights, buy and hold,
# 35 bps a side, dollar_volume_3m >= 100000, buys 2005 through 2020,
# valued at the end of 2023.
#
# Cell A, the primary cell (fwd_3y_cagr >= 0.1 & drawdown from entry < 0.2).
#
# Predictions, written before the run (2026-09-29):
#   - Ends within 15% of the SPY leg's final value, either side, and
#     within 10% of bt_nonloser_dd30_top10: the screen could not tell
#     the two cells' picks apart on return.
#   - A deeper worst drawdown than bt_nonloser_dd30_top10.
name = "bt_cagr10_dd20_top10"
dataset_version = "dataset_v1.4"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_cagr10_dd20_3y_df10b2ee396f",
]

[signal]
combine = "product"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m"
op = ">="
value = 100000.0

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2020-12-31
valuation_end = 2023-12-29

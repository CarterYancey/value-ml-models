# Decision 76 of docs/notes/2026-11-26-decisions.md (2026-11-26), item 2:
# the fs5 forest alone (112 old ranks plus the 8-K counts) under the
# candidate's rule on dataset_v1.5.1: the arm of the forest-alone pair.
# The screen inside the 100k floor had its picks +0.011 a year ahead of the
# fs0 forest's over same-size peers at three seeds (decision 76).
name = "bt_nonloser_events_forestC_top10_cap2_rankfloor_v151"
dataset_version = "dataset_v1.5.1"
prices_version = "prices_v1.0"
bundles = [
    "experiments/models/forest_nonloser_dd30_3y_events_v151_ff4822397404",
]
[signal]
combine = "product"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45
[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2
[portfolio]
strategy = "buy_and_hold"

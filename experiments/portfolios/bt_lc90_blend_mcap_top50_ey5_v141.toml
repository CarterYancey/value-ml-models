# Decision 81 of docs/notes/2026-11-26-decisions.md (2026-11-27), third
# round (81.7). After E10 (the candidate's three-leg blend, top 50 of the
# top-decile large caps, cap-weighted) matched E1's time-weighted return
# with a drawdown 8.5 points shallower and 12% less final money.
#
# # E11: E10 with an absolute valuation floor, earnings yield of 5% or
# more at the snapshot, inside the cap-weighted large-cap book. E6 (the
# equal-weighted candidate at an 8% floor) earned 12.6% a year in
# 2021-2026 against the candidate's 7.1%; this asks whether cheapness
# inside the safe set carries into the cap-weighted structure.
#
# Predictions (decision 81.7), written before the run:
#   (l) E11's 2021-2026 return is a point or more a year above E10's
#       (12.7%) and its 2005-2020 return within a point of E10's
#       (11.6%), with a deeper drawdown than E10's -37.4% (cheap large
#       caps fell further in 2008 and 2020); its final value is within
#       5% of E10's. Rival: the floor removes the large growth names
#       that are the only ones keeping pace with SPY, and the 2021-2026
#       return falls below E10's.
#
# Run: .venv/bin/vml-backtest experiments/portfolios/bt_lc90_blend_mcap_top50_ey5_v141.toml

name = "bt_lc90_blend_mcap_top50_ey5_v141"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_v141_f259c702a6a6",
    "experiments/models/factor_mom_12_2_3y_v141_121349f6e682",
    "experiments/models/factor_roc_greenblatt_3y_v141_4457ca01bcfb",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[investability]]
column = "log_marketcap_rank"
op = ">="
value = 0.9

[[filters]]
column = "earnings_yield"
op = ">="
value = 0.05

[portfolio]
strategy = "buy_and_hold"
top_k = 50
weighting = "marketcap"
monthly_cash = 1000.0

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30
fractional_shares = true

[window]
start = 2005-01-01
end = 2026-08-21
valuation_end = 2026-08-21

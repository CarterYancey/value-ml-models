# Decision 57 (2026-11-24): the larger-half variant traded to 2026-08-21 as
# context, the fixed rule read for this one variant (decision 28). Not a
# selection. Prediction: it trails SPY in 2021-26 by less than the
# candidate does (the giants that carried the index are in this band).
# Decision 55 of docs/notes/2026-09-29-decisions.md (2026-11-24). Carter asked
# for dataset_v1.4.1 (upstream decision 0021: the v1.4 code rebuilt on the
# 2026-11-21 Sharadar snapshot, with a provenance block). A patch is a
# different dataset for comparison, so the candidate is re-established on
# it: the same three legs refit on v1.4.1 (forest_nonloser_dd30_3y_v141,
# factor_mom_12_2_3y_v141, factor_roc_greenblatt_3y_v141), the same rule.
#
# This run: buy and hold to 2026-08-21, the fixed candidate on the new
# version, as decision 28 allows (not a selection: the candidate and its
# sell variant are the only portfolios traded on 2021-26). It replaces the
# October table in findings.md, which came from the old v1.4 build.
# No prediction against that table: the build changed. Check, not a
# prediction: the equity path to 2020-12-31 equals the rankfloor_v141
# run's to the cent.

name = "bt_nonloser_mom_roc_top10_cap2_rankfloor_largehalf_to2026_v141"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_v141_f259c702a6a6",
    "experiments/models/factor_mom_12_2_3y_v141_121349f6e682",
    "experiments/models/factor_roc_greenblatt_3y_v141_4457ca01bcfb",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[investability]]
column = "log_marketcap_rank"
op = ">="
value = 0.5

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2026-08-21
valuation_end = 2026-08-21

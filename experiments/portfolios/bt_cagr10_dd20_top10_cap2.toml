# bt_cagr10_dd20_top10 with a sector cap: at most 2 of a month's 10 buys per
# sector (docs/notes/2026-09-29-decisions.md, decision 7;
# docs/notes/2026-09-29-first-backtests.md). The template is otherwise
# decision 6's, unchanged.
#
# The uncapped backtest ended 26-29% below SPY with a worst drawdown of
# -63%: half its buys were utilities, a quarter REITs, and every buy of
# 2005-06 a REIT.
#
# Predictions, written before the run (2026-09-29):
#   - As for bt_nonloser_dd30_top10_cap2: 2007 within 10 points of SPY,
#     a worst drawdown shallower than the uncapped -64.1%, a final value
#     above the uncapped 534,517.
#   - With the cap the two cells' portfolios differ by more than they
#     did uncapped (4.5% on final value): past the first two names of a
#     sector the two models have to choose, and may choose differently.
name = "bt_cagr10_dd20_top10_cap2"
dataset_version = "dataset_v1.4"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_cagr10_dd20_3y_df10b2ee396f",
]

[signal]
combine = "product"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m"
op = ">="
value = 100000.0

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2020-12-31
valuation_end = 2023-12-29

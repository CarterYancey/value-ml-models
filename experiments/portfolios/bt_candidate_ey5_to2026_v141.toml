# Decision 81 of docs/notes/2026-11-26-decisions.md (2026-11-27): why the
# candidate has not beaten the market, and the experiments that separate
# the explanations. Note: docs/notes/2026-11-27-why-not-the-market.md.
#
# E5, the candidate with a floor on absolute valuation: a stock is a
# candidate only if its earnings yield at the snapshot is 5% or more.
# The share of liquid stocks clearing this floor runs from 10% (2021) to
# 48% (2009), so the floor buys less when the market is dear and more
# when it is cheap: a cash rule built from a row-level column, with no
# market-state input.
#
# Predictions (decision 81.4), written before the run:
#   (e) The candidate with an absolute valuation floor (earnings yield
#       of 5% or more at the snapshot) buys 15% to 25% fewer stocks over
#       the window, with the fewest in 2018 and 2021 (where only 10% to
#       17% of liquid stocks clear the floor) and the most in 2008-2009
#       (35% to 48%). Its buys of 2021-2023 lose less often than the
#       candidate's (3-year losers at least 5 points lower), its
#       drawdown is shallower, and its final value is within 5% of the
#       candidate's. Rival: the floor removes the calm, profitable,
#       fully priced stocks the forest likes best and leaves cheaper,
#       worse ones; then the 2005-2020 time-weighted return falls a
#       point or more below the candidate's and losers rise, as the
#       earnings-yield ranking's 57% losers warn.
#
# Same legs, costs, window and accounting as the candidate's record
# (bt_nonloser_mom_roc_top10_cap2_rankfloor_to2026_v141), dataset_v1.4.1.
# Run: .venv/bin/vml-backtest experiments/portfolios/bt_candidate_ey5_to2026_v141.toml

name = "bt_candidate_ey5_to2026_v141"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_v141_f259c702a6a6",
    "experiments/models/factor_mom_12_2_3y_v141_121349f6e682",
    "experiments/models/factor_roc_greenblatt_3y_v141_4457ca01bcfb",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[filters]]
column = "earnings_yield"
op = ">="
value = 0.05

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
max_per_group = 2
group_column = "sector"
monthly_cash = 1000.0

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2026-08-21
valuation_end = 2026-08-21

# Decision 70 (2026-11-25), the fallen-stock program, round 6: the cell C
# forest trained inside F50 (dist_5y_high <= -0.5 with the 100k floor), traded
# alone inside F50: top 10 a month, at most 2 per sector, equal weights,
# Carter's rank floor, 35 bps a side, buys 2006-2020 with year-end refits,
# valued at the end of 2020.
# The run to 2020 is the comparison window of decision 70: Carter's working assumption is that the market since 2021 is a bubble that deflates, so the strategies are compared before it. This is a risky choice, documented to be challenged.
# Prediction, written before the run: to the end of 2020 the portfolio ends above SPY on money and on TWR (the equity file of the run to 2023 was read first: 490,613 against 487,467 on 2020-12-01, so this run is for the record, not a prediction); drawdown deeper than -55%.
name = "bt_fallen50_forestC_top10_cap2_rankfloor_to2020"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_fallen50_cells_3y__label_3y_cagr_ge_0p0_and_3y_max_drawdown_from_entry_lt_0p3__fs0_b98ceed78486",
]

[signal]
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[investability]]
column = "dist_5y_high"
op = "<="
value = -0.5

[[investability]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2006-01-01
end = 2020-12-31
valuation_end = 2020-12-31

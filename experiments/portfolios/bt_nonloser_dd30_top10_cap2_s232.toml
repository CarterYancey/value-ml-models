# bt_nonloser_dd30_top10_cap2 with the forest's seed 232 in place of 23: a check of how
# much of the backtest's figure is chance
# (docs/notes/2026-09-29-decisions.md, decision 9). Nothing else
# differs.
#
# Seed 23: final value 633,757, time-weighted CAGR 9.74%, worst drawdown -46.1%.
#
# Prediction, written before the run (2026-09-29): the time-weighted
# CAGR within 0.7 points of seed 23's and the drawdown within 3 points.
# The forest's seeds agree on p@20 to 0.01, and with momentum half of
# the ranking does not depend on the seed at all. If the momentum
# portfolio's lead over the forest alone falls under 0.5 points a year
# on either seed, it was chance.
name = "bt_nonloser_dd30_top10_cap2_s232"
dataset_version = "dataset_v1.4"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_s232_de629f13deec",
]

[signal]
combine = "product"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m"
op = ">="
value = 100000.0

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2020-12-31
valuation_end = 2023-12-29

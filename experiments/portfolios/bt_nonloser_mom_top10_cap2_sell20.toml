# Decision 21 of docs/notes/2026-09-29-decisions.md (2026-09-30). The
# template of decision 6 with a cap of 2 per sector (decision 7);
# every figure is read beside SPY under the same deposits, and beside
# the per-buy table ("What the buys went on to do").
#
# What would make a new candidate, fixed before the run: final value at
# or above SPY's (732,110), time-weighted CAGR of 10.6% or more (SPY
# 9.58% plus a point), worst drawdown at least 5 points shallower than
# SPY's -52.9%, and a positive mean 3-year excess per buy for the buys
# of 2005-12 and of 2013-20.
#
# The candidate of decision 10 (cell C's forest and 12-month momentum)
# with the same sell discipline: sold once outside the top 20% of the
# month's candidates. Carter's item of 2026-09-30 ("a sell discipline
# for the candidate").
#
# Prediction (2026-09-30): momentum ranks turn over within months, so
# sales are several times the quality blend's; time-weighted CAGR not
# more than 0.5 points above buy and hold's 11.07%; costs four times
# buy and hold's or more.
name = "bt_nonloser_mom_top10_cap2_sell20"
dataset_version = "dataset_v1.4"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_53ceedd93e6d",
    "experiments/models/factor_mom_12_2_3y_97c0f095cf48",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m"
op = ">="
value = 100000.0

[portfolio]
strategy = "sell_below_criteria"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[sell]
max_rank_pct = 0.2
filters = []

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2020-12-31
valuation_end = 2023-12-29

# Decision 70 (2026-11-25), the fallen-stock program, round 6: the cell C
# forest trained inside F70 (dist_5y_high <= -0.7 with the 100k floor), traded
# alone inside F70: top 10 a month, at most 2 per sector, equal weights,
# Carter's rank floor, 35 bps a side, buys 2006-2020 with year-end refits,
# valued at the end of 2023.
# The run to 2023 is the program's original window (decision 65).
# Prediction, written before the run: TWR below SPY's on both windows, final value under SPY's by 10% or more, drawdown deeper than -60%; the buys lead same-size candidates by 8 points a year or more; losers over 3 years above 0.40.
name = "bt_fallen70_forestC_top10_cap2_rankfloor"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_fallen70_cells_3y__label_3y_cagr_ge_0p0_and_3y_max_drawdown_from_entry_lt_0p3_440e6e4b7645",
]

[signal]
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[investability]]
column = "dist_5y_high"
op = "<="
value = -0.7

[[investability]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2006-01-01
end = 2020-12-31
valuation_end = 2023-12-29

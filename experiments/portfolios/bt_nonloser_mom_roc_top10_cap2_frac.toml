# Decision 23 of docs/notes/2026-09-29-decisions.md (2026-09-30). The
# template of decision 6 with a cap of 2 per sector; the four criteria
# of decision 21 (final value at or above SPY's 732,110; time-weighted
# CAGR of 10.6% or more; worst drawdown at least 5 points shallower
# than SPY's -52.9%; positive mean 3-year excess per buy for the buys
# of 2005-12 and of 2013-20).
#
# bt_nonloser_mom_roc_top10_cap2 with fractional shares. The template
# buys whole shares with 100 a pick, on total-return adjusted prices:
# a stock priced above its budget is not bought that month (111 of 192
# months bought fewer than 10 stocks), and an adjusted price is not the
# price anyone paid. That is a selection rule nobody chose. This run
# removes it; nothing else changes.
#
# Prediction (2026-09-30): time-weighted CAGR within 1.0 point of
# 12.24% and final value within 10% of 948,956. If it is far below,
# the whole-share rule was doing part of the selecting and the
# whole-share figure is not the blend's.
name = "bt_nonloser_mom_roc_top10_cap2_frac"
dataset_version = "dataset_v1.4"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_53ceedd93e6d",
    "experiments/models/factor_mom_12_2_3y_97c0f095cf48",
    "experiments/models/factor_roc_greenblatt_3y_da640394cbba",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m"
op = ">="
value = 100000.0

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30
fractional_shares = true

[window]
start = 2005-01-01
end = 2020-12-31
valuation_end = 2023-12-29

# Decision 57 (2026-11-24): seed 1776 of the forest, the seed check of the
# larger-half filter (paired per seed against the candidate on the same
# seed). Prediction: the gap holds, +0.4 to +1.0 TWR points.
# Decision 55 of docs/notes/2026-09-29-decisions.md (2026-11-24). Carter asked
# for dataset_v1.4.1 (upstream decision 0021: the v1.4 code rebuilt on the
# 2026-11-21 Sharadar snapshot, with a provenance block). A patch is a
# different dataset for comparison, so the candidate is re-established on
# it: the same three legs refit on v1.4.1 (forest_nonloser_dd30_3y_v141,
# factor_mom_12_2_3y_v141, factor_roc_greenblatt_3y_v141), the same rule.
#
# This run, decision 55 item 3: the candidate restricted to the larger
# half of the investable stocks (one more investability filter,
# log_marketcap_rank >= 0.5), 2005-2020 valued end of 2023. The record
# says the candidate's lead is a same-size lead and that the smaller half
# trails SPY by 12 to 33 points a year over three years; the huber
# regressor failed in money because its band trails (decision 48). Asked
# the other way round: does the candidate beat SPY once it holds a band
# that keeps up with SPY? Read on TWR, MWR, final value, worst drawdown
# and vs_peers beside bt_nonloser_mom_roc_top10_cap2_rankfloor_v141.
# Prediction: TWR within 1 point of the candidate's (the forest's lead
# over same-size peers inside the larger half is +0.027 / +0.028 against
# +0.030 / +0.027 over all investable rows, while the band itself earns
# more); worst drawdown shallower than the candidate's. Rival: the band
# effect dominates and this run beats the candidate by more than 1 point.
# Carried forward (to 2026 as context, then seeds 232 and 1776) if TWR
# beats the candidate's by more than 0.33 (the seed spread) with a
# drawdown no deeper. Backtest configurations on 2005-2020 after this: 40.

name = "bt_nonloser_mom_roc_top10_cap2_rankfloor_largehalf_s1776_v141"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_s1776_v141_8f3eb8f1d305",
    "experiments/models/factor_mom_12_2_3y_v141_121349f6e682",
    "experiments/models/factor_roc_greenblatt_3y_v141_4457ca01bcfb",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[investability]]
column = "log_marketcap_rank"
op = ">="
value = 0.5

[portfolio]
strategy = "buy_and_hold"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2020-12-31
valuation_end = 2023-12-29

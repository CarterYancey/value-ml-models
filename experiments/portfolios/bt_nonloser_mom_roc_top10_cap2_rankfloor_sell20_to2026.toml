# Decision 28 of docs/notes/2026-09-29-decisions.md (2026-10-01): the
# candidate's sell-discipline variant (decision 24: the one to
# paper-trade beside buy and hold), traded to the end of the price
# panel with the deployment floor. See
# bt_nonloser_mom_roc_top10_cap2_rankfloor_to2026.toml for why, for
# what the refits are and for what this run is not (a selection).
# A holding is sold once it is outside the top 20% of the month's
# candidates by combined rank, or is not a candidate.
#
# This configuration has not been run with the rank floor before: its
# 2005-2020 path is new (the dollar-floor variant reached 1,090,591
# at the end of 2023 on buys to 2020, and 1,054,924 with buys to
# 2023). It is the same strategy under the floor Carter chose, not a
# new one.
#
# Predictions (2026-10-01), written before the run:
# 1. Value at 2023-12-29 within 10% of the dollar-floor variant's
#    1,054,924 (buys through 2023).
# 2. 2024, 2025 and 2026 to August against SPY: each within 4 points
#    of the buy-and-hold run's.
# 3. Final value above SPY's under the same deposits and within 10%
#    of the buy-and-hold run's, either side. The discipline's gain
#    over buy and hold (0.4 to 0.9 points a year on 2005-2023) was
#    predicted negative and came out positive: it is the less certain
#    of the two, and no sign is predicted for 2024-26.
# 4. Costs 3 to 6 times the buy-and-hold run's.
name = "bt_nonloser_mom_roc_top10_cap2_rankfloor_sell20_to2026"
dataset_version = "dataset_v1.4"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_53ceedd93e6d",
    "experiments/models/factor_mom_12_2_3y_97c0f095cf48",
    "experiments/models/factor_roc_greenblatt_3y_da640394cbba",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[portfolio]
strategy = "sell_below_criteria"
top_k = 10
weighting = "equal"
monthly_cash = 1000.0
max_per_group = 2
group_column = "sector"

[sell]
max_rank_pct = 0.2
filters = []

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30

[window]
start = 2005-01-01
end = 2026-08-21
valuation_end = 2026-08-21

# Decision 81 of docs/notes/2026-11-26-decisions.md (2026-11-27): why the
# candidate has not beaten the market, and the experiments that separate
# the explanations. Note: docs/notes/2026-11-27-why-not-the-market.md.
#
# E4, the same 50 names as E2 with equal weights: separates what the
# weighting does from what the selection does.
#
# Predictions (decision 81.4), written before the run:
#   (d) Equal-weighting the same 50 names costs 2 points or more a year
#       against E2 in 2021-2026 and under a point in 2005-2020: the
#       weighting, not the selection, is where the recent gap to SPY
#       comes from.
#
# Same legs, costs, window and accounting as the candidate's record
# (bt_nonloser_mom_roc_top10_cap2_rankfloor_to2026_v141), dataset_v1.4.1.
# Run: .venv/bin/vml-backtest experiments/portfolios/bt_lc90_equal_top50_v141.toml

name = "bt_lc90_equal_top50_v141"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_v141_f259c702a6a6",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[investability]]
column = "log_marketcap_rank"
op = ">="
value = 0.9

[portfolio]
strategy = "buy_and_hold"
top_k = 50
weighting = "equal"
monthly_cash = 1000.0

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30
fractional_shares = true
[window]
start = 2005-01-01
end = 2026-08-21
valuation_end = 2026-08-21

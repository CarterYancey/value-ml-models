# Decision 81 of docs/notes/2026-11-26-decisions.md (2026-11-27): why the
# candidate has not beaten the market, and the experiments that separate
# the explanations. Note: docs/notes/2026-11-27-why-not-the-market.md.
#
# E2, 'the index minus the predicted losers' (decision 32.3, never run):
# the top-decile large caps, each month the 50 highest by the not-a-
# loser forest's score (about half the universe), cap-weighted. The
# forest is used only to leave out the stocks it scores worst.
#
# Predictions (decision 81.4), written before the run:
#   (b) Keeping only the safer half of the large caps by the forest's
#       score, cap-weighted, beats E1 by 0.5 to 1.5 points a year over
#       2005-2026 with a drawdown at least 3 points shallower, and is
#       ahead of E1 in both 2005-2020 and 2021-2026, by less in the
#       second. Against SPY it ends within 1.5 points a year over the
#       whole window: ahead over 2005-2020 and behind over 2021-2026 by
#       2 to 4 points, not the candidate's 8. Rival (the hope): ahead of
#       SPY by a point or more a year over the whole window, 2021-2026
#       included; then loser-avoidance inside a cap-weighted book is the
#       thesis realized, and three seeds follow.
#
# Same legs, costs, window and accounting as the candidate's record
# (bt_nonloser_mom_roc_top10_cap2_rankfloor_to2026_v141), dataset_v1.4.1.
# Run: .venv/bin/vml-backtest experiments/portfolios/bt_lc90_mcap_top50_v141.toml

name = "bt_lc90_mcap_top50_v141"
dataset_version = "dataset_v1.4.1"
prices_version = "prices_v1.0"

bundles = [
    "experiments/models/forest_nonloser_dd30_3y_v141_f259c702a6a6",
]

[signal]
combine = "mean_rank"
max_staleness_days = 200
model_update = "refit"
label_lag_days = 45

[[investability]]
column = "dollar_volume_3m_rank"
op = ">="
value = 0.2

[[investability]]
column = "log_marketcap_rank"
op = ">="
value = 0.9

[portfolio]
strategy = "buy_and_hold"
top_k = 50
weighting = "marketcap"
monthly_cash = 1000.0

[execution]
cost_bps = 35.0
benchmark_cost_bps = 0.0
max_quote_age_days = 3
delist_after_days = 30
fractional_shares = true
[window]
start = 2005-01-01
end = 2026-08-21
valuation_end = 2026-08-21

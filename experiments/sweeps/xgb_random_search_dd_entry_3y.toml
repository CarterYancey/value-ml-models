# Parameter search in the from-entry compounder cell, XGBoost arm
# (docs/findings.md, "Plan", step 3; docs/notes/2026-09-28-plan.md,
# track 1 step 2). One of three searches with equal budgets: 40 draws,
# one seed (forest_random_search_dd_entry_3y,
# lgbm_random_search_dd_entry_3y).
#
# Cell: fwd_3y_cagr >= 0.1 & fwd_3y_max_drawdown_from_entry < 0.2, the
# primary cell. Base rate 0.21. XGBoost has not been run in this cell.
#
# Features: the ranks group, 112 columns on dataset_v1.4, chosen with
# forests (docs/notes/2026-09-29-feature-sets-dd-entry.md).
#
# device = "cpu": the sandbox this queue runs in has no GPU. device is
# a model param, so these runs hash apart from any cuda run of the
# same draws and the two are never mixed.
#
# Ranges: those of xgb_random_search_3y, class_weight without 0.1.
#
# The bars, seed-mean fold-mean: forests p@20 0.50 and PR-AUC 0.327;
# untuned LightGBM 0.39-0.40 and 0.303; conservative_score_rank 0.388
# and 0.301.
#
# Predictions, written before the run:
#   - XGBoost lands where LightGBM lands: the best draw's fold-mean
#     PR-AUC is within 0.005 of the best draw of
#     lgbm_random_search_dd_entry_3y.
#   - No draw exceeds the forests' 0.327.
#   - The best draws are shallow (max_depth 3-5) with a high
#     min_child_weight.
#   If a draw exceeds 0.327 it goes to the three-seed round on equal
#   terms with the forests.
#
# How to read it: the summary ranks on POOLED pr_auc, which is not the
# fold mean. Rank on the fold mean of pr_auc from the ledger rows, and
# on p@20 over 2013-20. One seed: p@20 differences under 0.03 are
# noise.
#
# Memory and time for XGBoost on CPU have not been measured in the
# sandbox (docs/agents.md).
#
# Pick outcomes and top_k 5 and 10 were added on 2026-09-29, before the
# first run (docs/notes/2026-09-29-decisions.md, decision 2): read them
# beside PR-AUC, which stays the ranking metric.
#
# Expanded: 1 cell x 1 feature set x 40 draws x 1 seed = 40 runs.
# Run: uv run vml-sweep experiments/sweeps/xgb_random_search_dd_entry_3y.toml
name = "xgb_random_search_dd_entry_3y"
dataset_version = "dataset_v1.4"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = "all"
seeds = [23]
top_k = [20, 10, 5, 50]
precision_targets = [0.75, 0.9]
rank_metric = "pr_auc"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.25",
  "fwd_3y_excess_cagr >= 0.05",
]
n_samples = 40
search_seed = 29

[[cells]]
label = "fwd_3y_cagr >= 0.1 & fwd_3y_max_drawdown_from_entry < 0.2"

[[features]]
groups = ["ranks"]

[model]
name = "xgboost"
device = "cpu"

[random]
learning_rate = { low = 0.01, high = 0.2, log = true }
n_estimators = { low = 100, high = 1500, int = true, log = true }
max_depth = { low = 3, high = 9, int = true }
min_child_weight = { low = 0.5, high = 200.0, log = true }
gamma = { low = 1e-4, high = 10.0, log = true }
subsample = { low = 0.6, high = 1.0 }
colsample_bytree = { low = 0.4, high = 1.0 }
reg_alpha = { low = 1e-4, high = 10.0, log = true }
reg_lambda = { low = 1e-2, high = 30.0, log = true }
class_weight = { choices = [1.0, 0.5, 0.25] }

# LightGBM random search on the primary relative-label cell.
#
# Why random search instead of a grid: the surface that matters is mostly
# continuous (learning rate, leaf minima, regularization), and grids
# either miss the good region or explode combinatorially. Random search
# covers every axis at full resolution for the same run budget, and with
# `search_seed` the draws are a pure function of this file — `--dry-run`
# shows exactly the configs that will run, and re-running the sweep
# reproduces them. All 160 runs land in the trial ledger like any grid.
#
# Range rationale (scale parameters are log-uniform — a learning rate of
# 0.02 vs 0.04 matters as much as 0.1 vs 0.2):
#   learning_rate 0.01–0.2   the useful band without early stopping; the
#                            capacity knob is the (rate x rounds) product,
#                            so both are sampled and the folds arbitrate
#   n_estimators  100–1500   boosting rounds are an ordinary hyperparameter
#                            here (no early stopping — a local validation
#                            split would violate invariant 1)
#   num_leaves    7–63       small trees; interactions in fundamentals are
#                            shallow, and precision-first wants purity over
#                            capacity
#   min_child_samples/weight strong leaf minima — the main defense against
#                            memorizing microcap noise at ~300k-row folds
#   subsample/colsample      row/feature bagging decorrelates trees and
#                            reduces the variance of the top of the ranking
#   reg_alpha/reg_lambda     log-uniform across "off" to "strong" — the
#                            folds decide how much shrinkage this cell needs
#   class_weight             the precision knob (w < 1 makes false
#                            positives expensive), sampled as a choice
#
# The feature axis makes feature-set choice part of the search instead of
# a manual pre-commitment: full rank features vs. cross-sectional ranks
# only (sector ranks add sector-relative context but halve NULL-free
# coverage in thin sectors).
#
# Expanded: 1 cell x 2 feature sets x 80 draws = 160 runs.
# Run: vml-sweep experiments/sweeps/lgbm_random_search_3y.toml
name = "lgbm_random_search_3y"
dataset_version = "dataset_v1.1"
scheme = "walkforward"
folds = "all"
seeds = [7]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "recall_at_prec_0.9"
n_samples = 80
search_seed = 11

[[cells]]
label = "label_3y_beat_spy"

[[features]]
groups = ["ranks", "sector_ranks"]

[[features]]
groups = ["ranks"]

[model]
name = "lightgbm"
subsample_freq = 1

[random]
learning_rate = { low = 0.01, high = 0.2, log = true }
n_estimators = { low = 100, high = 1500, int = true, log = true }
num_leaves = { low = 7, high = 63, int = true, log = true }
min_child_samples = { low = 20, high = 300, int = true, log = true }
min_child_weight = { low = 1e-3, high = 10.0, log = true }
subsample = { low = 0.6, high = 1.0 }
colsample_bytree = { low = 0.4, high = 1.0 }
reg_alpha = { low = 1e-4, high = 10.0, log = true }
reg_lambda = { low = 1e-3, high = 30.0, log = true }
class_weight = { choices = [1.0, 0.5, 0.25, 0.1] }

# Decision 75 of docs/notes/2026-11-26-decisions.md (2026-11-26), item 2a:
# the control (fs0), every rank column (fs1) and the old ranks plus the
# 8-K counts (fs5) of forest_v151_features_nonloser_3y at seeds 232 and
# 1776, so that the three-seed means separate seed noise from the two
# patterns of the seed-23 run: fs5's lead of +0.010 a year over fs0
# (t 1.9, ahead in 10 of 16 years) and the 1.7-3.0 point loser penalty
# of every arm that adds new columns. Same cell, screen and forest.
#
# Predictions (decision 75.2a), written before the run:
#   fs5's mean gain in lead over fs0 at three seeds is under +0.005 and
#   its share of losers stays above fs0's; fs1's loser penalty stays at
#   0.01 or more. Rival: fs5's gain holds at +0.008 or more with its
#   2005-08 lead no lower than fs0's; then the two counts the forest
#   used carry information and the arm goes to Carter as a backtest
#   question (74.6 still bars a carry while its losers are worse).
#
# Expanded: 1 cell x 3 feature sets x 1 set x 2 seeds = 6 runs. The sets are
# numbered by position: the run names say fs0, fs1 and fs2, and fs2 here is
# fs5 of the parent sweep (the old ranks plus the 8-K counts).
# Run: .venv/bin/vml-sweep experiments/sweeps/forest_v151_features_seeds_3y.toml
name = "forest_v151_features_seeds_3y"
note = "fs0, fs1 and fs5 at seeds 232 and 1776: the 8-K counts' lead over the control holds at +0.011 a year at three seeds (t 2.4, 13 of 16 years) with 1.4 points more losers; the full rank set's loser penalty is a first-half effect at 1.6 se (decision 76)"
dataset_version = "dataset_v1.5.1"
min_dataset_version = "1.5"
scheme = "walkforward"
folds = "all"
seeds = [232, 1776]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
universe_scope = "test"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_path_avg_return",
  "fwd_3y_path_avg_return > fwd_3y_spy_path_avg_return",
  "fwd_3y_max_runup",
  "fwd_3y_realized_vol",
  "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3",
]

sets = [
  {criterion = "entropy", max_depth = 4, max_features = 0.205191, max_samples = 0.663781, min_samples_leaf = 72, n_estimators = 490},  # the candidate's forest
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000


[[cells]]
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"

# fs0: the 112 rank columns of dataset_v1.4.1 — the control on this build
[[features]]
groups = ["ranks"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank", "bvps_consistency_8q_rank",
  "bvps_trend_12q_rank", "bvps_consistency_12q_rank", "bvps_trend_20q_rank", "bvps_consistency_20q_rank",
  "shares_trend_4q_rank", "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
  "roa_5y_median_rank", "roa_5y_std_rank", "roa_5y_z_rank", "roe_5y_median_rank", "roe_5y_std_rank", "roe_5y_z_rank",
  "gross_margin_5y_median_rank", "gross_margin_5y_std_rank", "gross_margin_5y_z_rank",
  "operating_margin_5y_median_rank", "operating_margin_5y_std_rank", "operating_margin_5y_z_rank",
  "earnings_yield_5y_avg_rank", "ocf_yield_5y_avg_rank", "fcf_yield_5y_avg_rank", "earnings_yield_5y_peak_rank",
  "earnings_yield_at_5y_median_margin_rank", "earnings_yield_10y_avg_rank", "netinc_vs_5y_peak_rank",
  "bvps_vs_5y_peak_rank", "netinc_sue_8q_rank", "revenue_sue_8q_rank", "revenue_cagr_10y_rank",
  "bvps_cagr_10y_rank", "shares_cagr_10y_rank",
]

# fs1: every rank column of dataset_v1.5.1, 149
[[features]]
groups = ["ranks"]

# fs5 of the parent sweep (fs2 in this sweep's run names): fs0 plus the 8-K counts, 126
[[features]]
groups = ["ranks"]
families = ["features/events"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank", "bvps_consistency_8q_rank",
  "bvps_trend_12q_rank", "bvps_consistency_12q_rank", "bvps_trend_20q_rank", "bvps_consistency_20q_rank",
  "shares_trend_4q_rank", "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
  "roa_5y_median_rank", "roa_5y_std_rank", "roa_5y_z_rank", "roe_5y_median_rank", "roe_5y_std_rank", "roe_5y_z_rank",
  "gross_margin_5y_median_rank", "gross_margin_5y_std_rank", "gross_margin_5y_z_rank",
  "operating_margin_5y_median_rank", "operating_margin_5y_std_rank", "operating_margin_5y_z_rank",
  "earnings_yield_5y_avg_rank", "ocf_yield_5y_avg_rank", "fcf_yield_5y_avg_rank", "earnings_yield_5y_peak_rank",
  "earnings_yield_at_5y_median_margin_rank", "earnings_yield_10y_avg_rank", "netinc_vs_5y_peak_rank",
  "bvps_vs_5y_peak_rank", "netinc_sue_8q_rank", "revenue_sue_8q_rank", "revenue_cagr_10y_rank",
  "bvps_cagr_10y_rank", "shares_cagr_10y_rank",
]

[model]
name = "random_forest"
bootstrap = true
class_weight = 1.0
n_jobs = 8

# Decision 70 (2026-11-25), the fallen-stock program, round 6: the grid of
# "fell X% from its h-year high". Universe W30: dist_52w_high <= -0.30 &
# dollar_volume_3m >= 100000, the liquid stocks 30% or more below their
# 52-week high (60,252 labeled median rows of 2005-2020 inside the floor;
# base rates: not a loser 0.263, doubled 0.173, losers 0.530, mean 3y
# CAGR -0.059). The candidate's forest configuration, 112 ranks, seed 23,
# cells C and recovery, all 16 folds, as in forest_fresh40_cells_3y.
# Prediction, written before the run: the forest learns cell C here as it
# did inside W40 (screen lead over same-size peers of 0.05 or more in both
# halves) and the lead grows with the depth of the fall; the picks' mean
# 3y CAGR falls with the depth and is below the F-universe forest's at the
# same depth; the recovery label is not learned (lead within 0.02 of zero).
# Run: vml-sweep experiments/sweeps/forest_fresh30_cells_3y.toml --save-models
name = "forest_fresh30_cells_3y"
dataset_version = "dataset_v1.4.1"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = "all"
seeds = [23]
top_k = [20, 50]
score_thresholds = [0.5, 0.6, 0.7]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.26",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_excess_cagr >= 0.1",
]

sets = [
  {criterion = "entropy", max_depth = 4, max_features = 0.205191, max_samples = 0.663781, min_samples_leaf = 72, n_estimators = 490},
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dist_52w_high"
op = "<="
value = -0.30

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[[cells]]
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"

[[cells]]
label = "fwd_3y_cagr >= 0.26"

[[features]]
groups = ["ranks"]

[model]
name = "random_forest"
bootstrap = true
class_weight = 1.0
n_jobs = 8

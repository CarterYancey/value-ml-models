# The single-factor bar for the pick-outcome screen, through the
# ledger (docs/findings.md, "Plan", track 2).
#
# baseline_lowvol_rank_3y ran these two factors in the primary cell
# before pick outcomes existed. Same factors and cell, now with the
# outcomes of the picks: what a label's forest has to beat on the
# screen. Deterministic, one seed. Adds 2 configurations to the
# primary cell (the hash includes pick_outcomes).
#
# The picks of a rank_factor baseline do not depend on the label, so
# their outcomes are the same in every cell; one cell is enough.
#
# Expected, from the harness smoke test of 2026-09-28 (scratch ledger):
# set0 p@20 0.3875 as in baseline_lowvol_rank_3y, picks' beat_spy hit
# rate 0.4906, median excess CAGR -0.0023. Different numbers mean the
# harness changed between the two.
#
# Expanded: 1 cell x 2 factors x 1 seed = 2 runs (about 30 s each).
# Run: uv run vml-sweep experiments/sweeps/baseline_pick_outcomes_3y.toml
name = "baseline_pick_outcomes_3y"
dataset_version = "dataset_v1.4"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = "all"
seeds = [7]
top_k = [20, 50]
rank_metric = "precision_at_20"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
]

sets = [
  {rank_column = "conservative_score_rank", higher_is_better = true},
  {rank_column = "vol_36m_rank", higher_is_better = false},
]

[[cells]]
label = "fwd_3y_cagr >= 0.1 & fwd_3y_max_drawdown_from_entry < 0.2"

[[features]]
groups = ["ranks"]

[model]
name = "rank_factor"

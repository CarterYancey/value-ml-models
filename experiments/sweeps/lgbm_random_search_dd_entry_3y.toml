# Parameter search in the from-entry compounder cell, LightGBM arm
# (docs/findings.md, "Plan", step 3; docs/notes/2026-09-28-plan.md,
# track 1 step 2). One of three searches with equal budgets: 40 draws,
# one seed (forest_random_search_dd_entry_3y,
# xgb_random_search_dd_entry_3y).
#
# Cell: fwd_3y_cagr >= 0.1 & fwd_3y_max_drawdown_from_entry < 0.2, the
# primary cell. Base rate 0.21.
#
# Features: the ranks group, 112 columns on dataset_v1.4. The feature
# set was chosen with forests
# (docs/notes/2026-09-29-feature-sets-dd-entry.md); it has not been
# compared for LightGBM.
#
# What LightGBM has done here so far, one untuned set
# (lgbm_drawdown_compounder_seeds_3y: 300 rounds, rate 0.05, 15
# leaves), three seeds, seed-mean fold-mean: p@20 0.394-0.400,
# 2013-20 0.40-0.43, PR-AUC 0.303. Level with the best single factor
# (conservative_score_rank: 0.388, PR-AUC 0.301) and below the
# forests (0.50, PR-AUC 0.327).
#
# Ranges: those of lgbm_random_search_3y. class_weight is sampled
# because 1.0 has not been run for LightGBM in this cell.
#
# Predictions, written before the run:
#   - Tuning helps LightGBM more than it helps forests: the best draw
#     reaches a fold-mean PR-AUC of at least 0.315, and the draws span
#     at least 0.02.
#   - The best draws are the most regularised: learning_rate x
#     n_estimators under about 10, or min_child_samples over 100.
#   - No draw exceeds the forests' 0.327.
#   If no draw exceeds 0.310, the gap to forests is not a tuning gap
#   within these ranges. If a draw exceeds 0.327, LightGBM is a
#   candidate family and goes to the three-seed round on equal terms.
#
# How to read it: the summary ranks on POOLED pr_auc, which is not the
# fold mean. Rank on the fold mean of pr_auc from the ledger rows, and
# on p@20 over 2013-20. One seed: p@20 differences under 0.03 are
# noise. Scores are not read as probabilities here.
#
# Memory and time for LightGBM have not been measured in the sandbox
# (docs/agents.md). A killed run is resumed by running the sweep
# again.
#
# Pick outcomes and top_k 5 and 10 were added on 2026-09-29, before the
# first run (docs/notes/2026-09-29-decisions.md, decision 2): read them
# beside PR-AUC, which stays the ranking metric.
#
# Expanded: 1 cell x 1 feature set x 40 draws x 1 seed = 40 runs.
# Run: uv run vml-sweep experiments/sweeps/lgbm_random_search_dd_entry_3y.toml
name = "lgbm_random_search_dd_entry_3y"
dataset_version = "dataset_v1.4"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = "all"
seeds = [23]
top_k = [20, 10, 5, 50]
precision_targets = [0.75, 0.9]
rank_metric = "pr_auc"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.25",
  "fwd_3y_excess_cagr >= 0.05",
]
n_samples = 40
search_seed = 29

[[cells]]
label = "fwd_3y_cagr >= 0.1 & fwd_3y_max_drawdown_from_entry < 0.2"

[[features]]
groups = ["ranks"]

[model]
name = "lightgbm"
subsample_freq = 1

[random]
learning_rate = { low = 0.01, high = 0.2, log = true }
n_estimators = { low = 100, high = 1500, int = true, log = true }
num_leaves = { low = 7, high = 63, int = true, log = true }
min_child_samples = { low = 20, high = 300, int = true, log = true }
min_child_weight = { low = 1e-3, high = 10.0, log = true }
subsample = { low = 0.6, high = 1.0 }
colsample_bytree = { low = 0.4, high = 1.0 }
reg_alpha = { low = 1e-4, high = 10.0, log = true }
reg_lambda = { low = 1e-3, high = 30.0, log = true }
class_weight = { choices = [1.0, 0.5, 0.25] }

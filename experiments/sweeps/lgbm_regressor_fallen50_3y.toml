# Decision 61 of docs/notes/2026-09-29-decisions.md (2026-11-25): the
# fallen-stock program. The regression reframe inside the fallen
# universe F50 (dist_5y_high <= -0.5 & dollar_volume_3m >= 100000):
# LightGBM on the 3-year CAGR, measured on the recovery label (doubled
# in 3 years), and on the 3-year excess CAGR, measured on beat SPY.
# Objectives: huber, quantile 0.5, quantile 0.25 ("whose bad case is
# best"). Parameters as in lgbm_regressor_growth_allrows_3y. Scores are
# predicted returns, not probabilities.
#
# Prediction (2026-11-25): the quantile 0.25 arm leads same-size fallen
# peers by more than the huber arm on the screen and has fewer losers;
# no arm's screen mean 3y CAGR reaches 0.105 in both halves.
#
# Expanded: 2 cells x 1 feature set x 3 sets x 1 seed = 6 runs.
# Run: vml-sweep experiments/sweeps/lgbm_regressor_fallen50_3y.toml --save-models
name = "lgbm_regressor_fallen50_3y"
dataset_version = "dataset_v1.4.1"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
seeds = [23]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.26",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_excess_cagr >= 0.1",
]

sets = [
  {objective = "huber"},
  {objective = "quantile", alpha = 0.5},
  {objective = "quantile", alpha = 0.25},
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dist_5y_high"
op = "<="
value = -0.5

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[[cells]]
label = "fwd_3y_cagr"
eval_label = "fwd_3y_cagr >= 0.26"

[[cells]]
label = "fwd_3y_excess_cagr"
eval_label = "label_3y_beat_spy"

[[features]]
groups = ["ranks"]

[model]
name = "lightgbm_regressor"
winsorize = 0.01
n_estimators = 300
learning_rate = 0.05
num_leaves = 15
min_child_samples = 60
subsample = 0.8
subsample_freq = 1
colsample_bytree = 0.8
reg_lambda = 1.0

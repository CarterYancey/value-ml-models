# Decision 78 of docs/notes/2026-11-26-decisions.md (2026-11-26), item 4:
# the 5-year horizon on folds 2007-18 (the walk-forward folds with an
# observable 5y label). The candidate's forest, seed 23, trained on
# every row and read inside the 100k floor on the same-size screen, on
# the 5-year CAGR lead and 5-year losers; the 3-year outcomes of the
# picks are reported beside them. Halves 2007-12 and 2013-18.
#
# Cells: C's 5-year twin (the control cell); 'doubled without a crash'
# (run-up 100%, never 40% down); 'a real gain without a crash' (CAGR
# 15%, never 30% down); run-up 100%.
# Feature sets: fs0 the 112 old ranks; fs1 every raw fundamental column,
# 193; fs2 (= fs4 of the 3y sweep) the compact own-history set plus the
# price against its own past, 77.
#
# Prediction (decision 78.5e): the cells order as at 3 years; the leads
# are larger in points and no larger against their noise.
#
# Expanded: 4 cells x 3 feature sets x 1 set x 1 seed = 12 runs.
# Run: .venv/bin/vml-sweep experiments/sweeps/forest_fund_labels_5y.toml
name = "forest_fund_labels_5y"
dataset_version = "dataset_v1.5.1"
min_dataset_version = "1.5"
scheme = "walkforward"
folds = [2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018]
seeds = [23]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
universe_scope = "test"
pick_outcomes = [
  "label_5y_beat_spy",
  "fwd_5y_excess_cagr",
  "fwd_5y_cagr",
  "fwd_5y_max_drawdown_from_entry",
  "fwd_5y_cagr < 0",
  "fwd_5y_cagr < -0.1",
  "fwd_5y_max_drawdown_from_entry >= 0.5",
  "fwd_5y_cagr >= 0.15",
  "fwd_5y_max_runup",
  "fwd_5y_max_runup >= 1.0",
  "fwd_5y_realized_vol",
  "fwd_5y_cagr >= 0 & fwd_5y_max_drawdown_from_entry < 0.3",
  "fwd_5y_max_runup >= 1.0 & fwd_5y_max_drawdown_from_entry < 0.4",
  "fwd_5y_cagr >= 0.15 & fwd_5y_max_drawdown_from_entry < 0.3",
  "fwd_3y_cagr",
  "fwd_3y_cagr < 0",
  "fwd_3y_max_drawdown_from_entry >= 0.5",
  "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3",
]

sets = [
  {criterion = "entropy", max_depth = 4, max_features = 0.205191, max_samples = 0.663781, min_samples_leaf = 72, n_estimators = 490},  # the candidate's forest
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[[cells]]
label = "fwd_5y_cagr >= 0 & fwd_5y_max_drawdown_from_entry < 0.3"

[[cells]]
label = "fwd_5y_max_runup >= 1.0 & fwd_5y_max_drawdown_from_entry < 0.4"

[[cells]]
label = "fwd_5y_cagr >= 0.15 & fwd_5y_max_drawdown_from_entry < 0.3"

[[cells]]
label = "fwd_5y_max_runup >= 1.0"

# fs0: the 112 rank columns of dataset_v1.4.1 — the control set
[[features]]
groups = ["ranks"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank",
  "bvps_consistency_8q_rank", "bvps_trend_12q_rank", "bvps_consistency_12q_rank",
  "bvps_trend_20q_rank", "bvps_consistency_20q_rank", "shares_trend_4q_rank",
  "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
  "roa_5y_median_rank", "roa_5y_std_rank", "roa_5y_z_rank", "roe_5y_median_rank",
  "roe_5y_std_rank", "roe_5y_z_rank", "gross_margin_5y_median_rank",
  "gross_margin_5y_std_rank", "gross_margin_5y_z_rank", "operating_margin_5y_median_rank",
  "operating_margin_5y_std_rank", "operating_margin_5y_z_rank", "earnings_yield_5y_avg_rank",
  "ocf_yield_5y_avg_rank", "fcf_yield_5y_avg_rank", "earnings_yield_5y_peak_rank",
  "earnings_yield_at_5y_median_margin_rank", "earnings_yield_10y_avg_rank",
  "netinc_vs_5y_peak_rank", "bvps_vs_5y_peak_rank", "netinc_sue_8q_rank",
  "revenue_sue_8q_rank", "revenue_cagr_10y_rank", "bvps_cagr_10y_rank", "shares_cagr_10y_rank",
]

# fs1: every raw fundamental column, 193 — no technical, events, classification or meta family
[[features]]
groups = ["features"]
exclude_families = ["features/technical", "features/events", "features/classification", "features/meta"]

# fs2 here (fs4 of the 3y sweep): fs3 plus the price against its own past (dist_5y_high, dist_52w_high, price_vs_5y_avg), 77
[[features]]
families = ["features/fundhist", "features/relvalue"]
columns = [
  "div_years_paid_10y", "div_streak_10y", "div_cuts_10y", "div_history_years_10y",
  "fund_history_quarters", "ni_positive_frac_20q", "ocf_positive_frac_20q", "earnings_yield",
  "fcf_yield", "ocf_yield", "book_to_market", "ebit_to_ev", "dividend_yield",
  "net_payout_yield", "roa", "roe", "gross_margin", "operating_margin", "roc_greenblatt",
  "cfo_to_assets", "altman_z", "debt_to_equity", "liabilities_to_assets", "interest_coverage",
  "current_ratio", "log_assets", "accruals_to_assets", "piotroski_f", "asset_growth_1y",
  "share_count_growth_1y", "revenue_growth_3y", "dist_5y_high", "dist_52w_high",
  "price_vs_5y_avg",
]

[model]
name = "random_forest"
bootstrap = true
class_weight = 1.0
n_jobs = 8

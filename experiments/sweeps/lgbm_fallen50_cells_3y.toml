# Decision 63 (2026-11-25): the fallen-stock program, round 3, a second
# model family. LightGBM classifiers inside F50 on cell C and on the
# recovery label, two parameter sets from lgbm_candidate_sets_3y (set0
# and set2 there), class weight 1.0, seed 23.
# Prediction: within 0.03 of the forest's p@20 on cell C (0.533) and no
# skill on the recovery label (p@20 under 0.26).
# Run: vml-sweep experiments/sweeps/lgbm_fallen50_cells_3y.toml --save-models
name = "lgbm_fallen50_cells_3y"
dataset_version = "dataset_v1.4.1"
min_dataset_version = "1.4"
scheme = "walkforward"
folds = [2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020]
seeds = [23]
top_k = [20, 50]
score_thresholds = [0.5, 0.6, 0.7]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_cagr >= 0.26",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_excess_cagr >= 0.1",
]

sets = [
  {n_estimators = 300, num_leaves = 7,  learning_rate = 0.05, subsample = 0.9, subsample_freq = 1, colsample_bytree = 0.8, reg_alpha = 0.0,  reg_lambda = 1.0},
  {n_estimators = 500, num_leaves = 7,  learning_rate = 0.02, subsample = 0.7, subsample_freq = 1, colsample_bytree = 0.4, reg_alpha = 0.0,  reg_lambda = 20.0},
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dist_5y_high"
op = "<="
value = -0.5

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000

[[cells]]
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"

[[cells]]
label = "fwd_3y_cagr >= 0.26"

[[features]]
groups = ["ranks"]

[model]
name = "lightgbm"
class_weight = 1.0
min_child_samples = 40

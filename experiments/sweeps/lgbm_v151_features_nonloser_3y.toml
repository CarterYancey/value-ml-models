# Decision 74 of docs/notes/2026-11-26-decisions.md (2026-11-26), item 2:
# LightGBM on the first three feature sets of
# forest_v151_features_nonloser_3y (fs0 the 112 old ranks, fs1 all 149
# ranks, fs2 fs1 plus the 18 unranked new columns), cell C, the two
# parameter sets of lgbm_fallen50_cells_3y (2026-11-25), seed 23, same
# screen inside the 100k floor.
#
# Prediction (decision 74.5c): LightGBM within 0.01 of the forest's
# p@20 on each set, as inside F50; the same ordering of fs0, fs1, fs2
# as the forest's.
#
# Expanded: 1 cell x 3 feature sets x 2 sets x 1 seed = 6 runs.
# Run: .venv/bin/vml-sweep experiments/sweeps/lgbm_v151_features_nonloser_3y.toml
name = "lgbm_v151_features_nonloser_3y"
dataset_version = "dataset_v1.5.1"
min_dataset_version = "1.5"
scheme = "walkforward"
folds = "all"
seeds = [23]
top_k = [20, 50]
precision_targets = [0.75, 0.9]
rank_metric = "precision_at_20"
universe_scope = "test"
pick_outcomes = [
  "label_3y_beat_spy",
  "fwd_3y_excess_cagr",
  "fwd_3y_cagr",
  "fwd_3y_max_drawdown_from_entry",
  "fwd_3y_cagr < 0",
  "fwd_3y_cagr < -0.1",
  "fwd_3y_max_drawdown_from_entry >= 0.4",
  "fwd_3y_cagr >= 0.15",
  "fwd_3y_excess_cagr >= 0.05",
  "fwd_3y_path_avg_return",
  "fwd_3y_path_avg_return > fwd_3y_spy_path_avg_return",
  "fwd_3y_max_runup",
  "fwd_3y_realized_vol",
  "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3",
]

sets = [
  {n_estimators = 300, num_leaves = 7,  learning_rate = 0.05, subsample = 0.9, subsample_freq = 1, colsample_bytree = 0.8, reg_alpha = 0.0,  reg_lambda = 1.0},
  {n_estimators = 500, num_leaves = 7,  learning_rate = 0.02, subsample = 0.7, subsample_freq = 1, colsample_bytree = 0.4, reg_alpha = 0.0,  reg_lambda = 20.0},
]

[pick_screen]
per = "quarter"
top_k = 10
max_per_group = 2
group_column = "sector"
peer_column = "log_marketcap_rank"
peer_bins = 20

[[universe]]
column = "dollar_volume_3m"
op = ">="
value = 100000


[[cells]]
label = "fwd_3y_cagr >= 0 & fwd_3y_max_drawdown_from_entry < 0.3"

# fs0: the 112 rank columns of dataset_v1.4.1 — the control on this build
[[features]]
groups = ["ranks"]
exclude_columns = [
  "bvps_trend_4q_rank", "bvps_consistency_4q_rank", "bvps_trend_8q_rank", "bvps_consistency_8q_rank",
  "bvps_trend_12q_rank", "bvps_consistency_12q_rank", "bvps_trend_20q_rank", "bvps_consistency_20q_rank",
  "shares_trend_4q_rank", "shares_trend_8q_rank", "shares_trend_12q_rank", "shares_trend_20q_rank",
  "roa_5y_median_rank", "roa_5y_std_rank", "roa_5y_z_rank", "roe_5y_median_rank", "roe_5y_std_rank", "roe_5y_z_rank",
  "gross_margin_5y_median_rank", "gross_margin_5y_std_rank", "gross_margin_5y_z_rank",
  "operating_margin_5y_median_rank", "operating_margin_5y_std_rank", "operating_margin_5y_z_rank",
  "earnings_yield_5y_avg_rank", "ocf_yield_5y_avg_rank", "fcf_yield_5y_avg_rank", "earnings_yield_5y_peak_rank",
  "earnings_yield_at_5y_median_margin_rank", "earnings_yield_10y_avg_rank", "netinc_vs_5y_peak_rank",
  "bvps_vs_5y_peak_rank", "netinc_sue_8q_rank", "revenue_sue_8q_rank", "revenue_cagr_10y_rank",
  "bvps_cagr_10y_rank", "shares_cagr_10y_rank",
]

# fs1: every rank column of dataset_v1.5.1, 149
[[features]]
groups = ["ranks"]

# fs2: fs1 plus the 18 new columns upstream ships unranked, 167
[[features]]
groups = ["ranks"]
columns = [
  "revenue_vs_5y_peak", "revenue_quarters_since_5y_peak", "netinc_quarters_since_5y_peak",
  "bvps_quarters_since_5y_peak", "ni_positive_years_10y", "ni_history_years_10y",
  "bvps_up_frac_4q", "bvps_up_frac_8q", "bvps_up_frac_12q", "bvps_up_frac_20q",
  "shares_up_frac_4q", "shares_up_frac_8q", "shares_up_frac_12q", "shares_up_frac_20q",
  "ni_positive_frac_4q", "ni_positive_frac_8q", "ni_positive_frac_12q", "ni_positive_frac_20q",
]
[model]
name = "lightgbm"
class_weight = 1.0
min_child_samples = 40

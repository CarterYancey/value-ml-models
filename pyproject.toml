[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "value-ml-models"
version = "0.1.0"
description = "Interpretable, calibrated stock-return classifiers on top of the versioned sharadar-dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "lightgbm>=4.3",
    "xgboost>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vml-run = "harness.cli:main"
vml-sweep = "harness.sweep:main"
vml-eval = "harness.evaluate:main"
vml-train-deploy = "harness.deploy:main_train"
vml-predict = "harness.deploy:main_predict"
vml-experiments = "harness.catalog:main"
vml-promote = "harness.promote:main"
vml-backtest = "portfolio.backtest:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
